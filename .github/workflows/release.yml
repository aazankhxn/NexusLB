name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  build-binaries:
    name: Build Release Binaries
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: nexuslb-linux-amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: nexuslb-linux-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: nexuslb-darwin-amd64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: nexuslb-darwin-arm64

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Binary
        run: cargo build --release -p nexuslb-cli --target ${{ matrix.target }}

      - name: Package Artifact
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/nexuslb dist/${{ matrix.artifact_name }}
          cd dist
          tar -czvf ${{ matrix.artifact_name }}.tar.gz ${{ matrix.artifact_name }}
          shasum -a 256 ${{ matrix.artifact_name }}.tar.gz > ${{ matrix.artifact_name }}.tar.gz.sha256

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*

  publish-release:
    name: Publish GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Generate Checksums
        run: |
          cd release-artifacts
          find . -name "*.tar.gz" -exec sha256sum {} + > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/**/*.tar.gz
            release-artifacts/**/SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true
