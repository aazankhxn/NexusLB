apiVersion: v1
kind: ConfigMap
metadata:
  name: nexuslb-config
  labels:
    app: nexuslb
data:
  nexuslb.yaml: |
    server:
      listen:
        - "0.0.0.0:8080"
      workers: auto
      engine: auto
      reuse_port: true
      tcp_nodelay: true

    load_balancer:
      algorithm: adaptive
      default_pool: default

    backends:
      - name: svc-upstream-1
        address: "upstream-service-1:80"
        weight: 100
      - name: svc-upstream-2
        address: "upstream-service-2:80"
        weight: 100

    health_check:
      enabled: true
      interval: 5s
      timeout: 2s
      healthy_threshold: 2
      unhealthy_threshold: 3

    circuit_breaker:
      enabled: true
      failure_threshold: 5
      success_threshold: 3
      cool_down: 10s

    metrics:
      enabled: true
      address: "0.0.0.0:9090"

    admin:
      enabled: false
      address: "0.0.0.0:9091"
