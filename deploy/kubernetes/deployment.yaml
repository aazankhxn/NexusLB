apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexuslb
  labels:
    app: nexuslb
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nexuslb
  template:
    metadata:
      labels:
        app: nexuslb
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: nexuslb
          image: nexuslb:latest
          imagePullPolicy: IfNotPresent
          command: ["nexuslb", "start", "--config", "/etc/nexuslb/nexuslb.yaml"]
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
            - name: admin
              containerPort: 9091
          resources:
            requests:
              cpu: "500m"
              memory: "128Mi"
            limits:
              cpu: "4000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 9091
            initialDelaySeconds: 2
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: 9091
            initialDelaySeconds: 2
            periodSeconds: 3
          volumeMounts:
            - name: config-volume
              mountPath: /etc/nexuslb
      volumes:
        - name: config-volume
          configMap:
            name: nexuslb-config
