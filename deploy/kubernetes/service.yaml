apiVersion: v1
kind: Service
metadata:
  name: nexuslb
  labels:
    app: nexuslb
spec:
  type: LoadBalancer
  selector:
    app: nexuslb
  ports:
    - name: http
      port: 80
      targetPort: 8080
    - name: metrics
      port: 9090
      targetPort: 9090
    - name: admin
      port: 9091
      targetPort: 9091
