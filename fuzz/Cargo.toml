[package]
name = "nexuslb-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
nexuslb-core = { path = "../crates/nexuslb-core" }
nexuslb-config = { path = "../crates/nexuslb-config" }
nexuslb-dataplane = { path = "../crates/nexuslb-dataplane" }
nexuslb-router = { path = "../crates/nexuslb-router" }

[[bin]]
name = "fuzz_http_protocol"
path = "fuzz_targets/fuzz_http_protocol.rs"
test = false
doc = false

[[bin]]
name = "fuzz_config"
path = "fuzz_targets/fuzz_config.rs"
test = false
doc = false
