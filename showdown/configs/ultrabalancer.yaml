listen_address: "0.0.0.0"
listen_port: 8080
algorithm: "round-robin"

backends:
  - host: "127.0.0.1"
    port: 9001
    weight: 100
  - host: "127.0.0.1"
    port: 9002
    weight: 100

health_check:
  enabled: true
  interval_ms: 5000
  max_failures: 3

timeout:
  connect_ms: 5000
  request_ms: 30000
